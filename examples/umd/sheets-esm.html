<body>
    <div id="app"></div>

    <script type="module">
        import { LocaleType, Univer, UniverInstanceType, mergeLocales } from '/packages/core/lib/es/index.js';
        import { FUniver } from '/packages/core/lib/es/facade.js';
        import { UniverDocsPlugin } from '/packages/docs/lib/es/index.js';
        import { UniverDocsUIPlugin } from '/packages/docs-ui/lib/es/index.js';
        import zhCNDocsUi from '/packages/docs-ui/lib/es/locale/zh-CN.js';
        import { UniverFormulaEnginePlugin } from '/packages/engine-formula/lib/es/index.js';
        import { UniverRenderEnginePlugin } from '/packages/engine-render/lib/es/index.js';
        import { UniverSheetsPlugin } from '/packages/sheets/lib/es/index.js';
        import zhCNSheets from '/packages/sheets/lib/es/locale/zh-CN.js';
        import { UniverSheetsFormulaPlugin } from '/packages/sheets-formula/lib/es/index.js';
        import { UniverSheetsFormulaUIPlugin } from '/packages/sheets-formula-ui/lib/es/index.js';
        import zhCNSheetsFormulaUi from '/packages/sheets-formula-ui/lib/es/locale/zh-CN.js';
        import { UniverSheetsNumfmtPlugin } from '/packages/sheets-numfmt/lib/es/index.js';
        import { UniverSheetsNumfmtUIPlugin } from '/packages/sheets-numfmt-ui/lib/es/index.js';
        import zhCNSheetsNumfmtUi from '/packages/sheets-numfmt-ui/lib/es/locale/zh-CN.js';
        import { UniverSheetsUIPlugin } from '/packages/sheets-ui/lib/es/index.js';
        import zhCNSheetsUi from '/packages/sheets-ui/lib/es/locale/zh-CN.js';
        import { UniverUIPlugin } from '/packages/ui/lib/es/index.js';
        import zhCNUi from '/packages/ui/lib/es/locale/zh-CN.js';
        import zhCNDesign from '/packages/design/lib/es/locale/zh-CN.js';

        import '/packages/engine-formula/lib/es/facade.js';
        import '/packages/ui/lib/es/facade.js';
        import '/packages/docs-ui/lib/es/facade.js';
        import '/packages/sheets/lib/es/facade.js';
        import '/packages/sheets-ui/lib/es/facade.js';
        import '/packages/sheets-formula/lib/es/facade.js';
        import '/packages/sheets-numfmt/lib/es/facade.js';

        const univer = new Univer({
            locale: LocaleType.ZH_CN,
            locales: {
                [LocaleType.ZH_CN]: mergeLocales(
                    zhCNDesign,
                    zhCNUi,
                    zhCNDocsUi,
                    zhCNSheets,
                    zhCNSheetsUi,
                    zhCNSheetsFormulaUi,
                    zhCNSheetsNumfmtUi,
                ),
            },
        });

        univer.registerPlugin(UniverRenderEnginePlugin);
        univer.registerPlugin(UniverFormulaEnginePlugin);
        univer.registerPlugin(UniverUIPlugin, {
            container: 'app',
        });
        univer.registerPlugin(UniverDocsPlugin);
        univer.registerPlugin(UniverDocsUIPlugin);
        univer.registerPlugin(UniverSheetsPlugin);
        univer.registerPlugin(UniverSheetsUIPlugin);
        univer.registerPlugin(UniverSheetsFormulaPlugin);
        univer.registerPlugin(UniverSheetsFormulaUIPlugin);
        univer.registerPlugin(UniverSheetsNumfmtPlugin);
        univer.registerPlugin(UniverSheetsNumfmtUIPlugin);

        univer.createUnit(UniverInstanceType.UNIVER_SHEET, {});

        const univerAPI = FUniver.newAPI(univer);
        window.univer = univer;
        window.univerAPI = univerAPI;
    </script>
</body>
